<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIRRY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css')}}">
    <meta http-equiv="Accept-CH" content="Sec-CH-UA-Platform-Version, Sec-CH-UA-Model" /><link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imagenes/logo-shirry.png')}}"/>
</head>

<body>
    <div class="navbar">
        <a href="/index" class="logo">SHIRRY</a>
        <img src="{{ url_for('static', filename='imagenes/logo-shirry.png')}}" width="80" height="60">

        <div class="menu">
            <a href="/ropa">ROPA</a>
            <a href="/quienes-somos">QUIENES SOMOS</a>
            <a href="/tiendas">TIENDAS</a>
            <div class="perfil-contenedor">
                <img src="{{ url_for('static', filename='imagenes/icono-perfil.png')}}" class="icono-usuario" width="50" height="50"> 
                <div class="menu-desplegable">
                    <ul class="opciones-perfil">
                        <a href="/inicio-sesion">Inicio Sesion/Registro</a>  

                </div>
            </div>
        </div>
    </div>


<div class="registro-container" >
    <form class="registro-form" action="/sesion" method="post">
        <h2>Crear Cuenta</h2>
        
        <div class="input-group">
             <label for="nombre">Nombre:</label>
             <input type="text" id="nombre" name="nombre" required>
        <br><br>
        </div>

        <div class="input-group">
            <label for="contrasena">Contrasena:</label>
            <input type="password" id="contrasena" name="contrasena" required>
        <br><br>
        </div>

        <button type="submit" class="btn-registro">Inicio Sesion</button>
        
        <p class="login-link">¿No tienes cuenta? <a href="{{ url_for('inicio_sesion') }}"></p>
    </form>
</div>

</body>
</html>
